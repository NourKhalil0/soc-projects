<svg width="900" height="300" viewBox="0 0 900 300" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
<rect width="900" height="300" fill="#f4f6f8"/>
<text x="108" y="50" font-size="11" font-weight="bold" fill="#222" text-anchor="end">Input</text>
<line x1="115" y1="10" x2="855" y2="10" stroke="#ccc" stroke-width="1"/>
<rect x="120" y="17" width="584" height="56" fill="#1a5276" rx="2"/>
<text x="412" y="41" font-size="10" font-weight="bold" fill="white" text-anchor="middle">auth.log file</text>
<text x="412" y="55" font-size="9" fill="#d6eaf8" text-anchor="middle">SSH authentication log</text>
<rect x="708" y="17" width="143" height="56" fill="#2980b9" rx="2"/>
<text x="779" y="41" font-size="10" font-weight="bold" fill="white" text-anchor="middle">Threshold</text>
<text x="779" y="55" font-size="9" fill="#d6eaf8" text-anchor="middle">--threshold N</text>
<text x="108" y="120" font-size="11" font-weight="bold" fill="#222" text-anchor="end">Parsing</text>
<line x1="115" y1="80" x2="855" y2="80" stroke="#ccc" stroke-width="1"/>
<rect x="120" y="87" width="290" height="56" fill="#c0392b" rx="2"/>
<text x="265" y="111" font-size="10" font-weight="bold" fill="white" text-anchor="middle">Failed login lines</text>
<text x="265" y="125" font-size="9" fill="#d6eaf8" text-anchor="middle">regex match</text>
<rect x="414" y="87" width="290" height="56" fill="#2980b9" rx="2"/>
<text x="559" y="111" font-size="10" font-weight="bold" fill="white" text-anchor="middle">Successful login lines</text>
<text x="559" y="125" font-size="9" fill="#d6eaf8" text-anchor="middle">regex match</text>
<rect x="708" y="87" width="143" height="56" fill="#85c1e9" rx="2"/>
<text x="779" y="111" font-size="10" font-weight="bold" fill="white" text-anchor="middle">IP + user extraction</text>
<text x="779" y="125" font-size="9" fill="#d6eaf8" text-anchor="middle">per event</text>
<text x="108" y="190" font-size="11" font-weight="bold" fill="#222" text-anchor="end">Analysis</text>
<line x1="115" y1="150" x2="855" y2="150" stroke="#ccc" stroke-width="1"/>
<rect x="120" y="157" width="290" height="56" fill="#1a5276" rx="2"/>
<text x="265" y="181" font-size="10" font-weight="bold" fill="white" text-anchor="middle">Failed count per IP</text>
<text x="265" y="195" font-size="9" fill="#d6eaf8" text-anchor="middle">counter dict</text>
<rect x="414" y="157" width="290" height="56" fill="#2980b9" rx="2"/>
<text x="559" y="181" font-size="10" font-weight="bold" fill="white" text-anchor="middle">Success tracking</text>
<text x="559" y="195" font-size="9" fill="#d6eaf8" text-anchor="middle">user + timestamp</text>
<rect x="708" y="157" width="143" height="56" fill="#c0392b" rx="2"/>
<text x="779" y="181" font-size="10" font-weight="bold" fill="white" text-anchor="middle">Brute force flag</text>
<text x="779" y="195" font-size="9" fill="#d6eaf8" text-anchor="middle">exceeds threshold</text>
<text x="108" y="260" font-size="11" font-weight="bold" fill="#222" text-anchor="end">Output</text>
<line x1="115" y1="220" x2="855" y2="220" stroke="#ccc" stroke-width="1"/>
<rect x="120" y="227" width="290" height="56" fill="#c0392b" rx="2"/>
<text x="265" y="251" font-size="10" font-weight="bold" fill="white" text-anchor="middle">Flagged IPs</text>
<text x="265" y="265" font-size="9" fill="#d6eaf8" text-anchor="middle">with fail count</text>
<rect x="414" y="227" width="290" height="56" fill="#1a5276" rx="2"/>
<text x="559" y="251" font-size="10" font-weight="bold" fill="white" text-anchor="middle">Successful logins</text>
<text x="559" y="265" font-size="9" fill="#d6eaf8" text-anchor="middle">user + source</text>
<rect x="708" y="227" width="143" height="56" fill="#2980b9" rx="2"/>
<text x="779" y="251" font-size="10" font-weight="bold" fill="white" text-anchor="middle">Summary</text>
<text x="779" y="265" font-size="9" fill="#d6eaf8" text-anchor="middle">stats</text>
<line x1="115" y1="290" x2="855" y2="290" stroke="#ccc" stroke-width="1"/>
</svg>