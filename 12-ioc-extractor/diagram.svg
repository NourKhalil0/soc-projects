<svg width="900" height="300" viewBox="0 0 900 300" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
<rect width="900" height="300" fill="#f4f6f8"/>
<text x="108" y="50" font-size="11" font-weight="bold" fill="#222" text-anchor="end">Input</text>
<line x1="115" y1="10" x2="855" y2="10" stroke="#ccc" stroke-width="1"/>
<rect x="120" y="17" width="437" height="56" fill="#1a5276" rx="2"/>
<text x="338" y="41" font-size="10" font-weight="bold" fill="white" text-anchor="middle">Raw text</text>
<text x="338" y="55" font-size="9" fill="#d6eaf8" text-anchor="middle">report paste log</text>
<rect x="561" y="17" width="290" height="56" fill="#2980b9" rx="2"/>
<text x="706" y="41" font-size="10" font-weight="bold" fill="white" text-anchor="middle">File input</text>
<text x="706" y="55" font-size="9" fill="#d6eaf8" text-anchor="middle">--file option</text>
<text x="108" y="120" font-size="11" font-weight="bold" fill="#222" text-anchor="end">Extraction</text>
<line x1="115" y1="80" x2="855" y2="80" stroke="#ccc" stroke-width="1"/>
<rect x="120" y="87" width="143" height="56" fill="#1a5276" rx="2"/>
<text x="191" y="111" font-size="10" font-weight="bold" fill="white" text-anchor="middle">IP addresses</text>
<text x="191" y="125" font-size="9" fill="#d6eaf8" text-anchor="middle">IPv4 + IPv6 regex</text>
<rect x="267" y="87" width="143" height="56" fill="#1a5276" rx="2"/>
<text x="338" y="111" font-size="10" font-weight="bold" fill="white" text-anchor="middle">Domains</text>
<text x="338" y="125" font-size="9" fill="#d6eaf8" text-anchor="middle">FQDN pattern</text>
<rect x="414" y="87" width="143" height="56" fill="#2980b9" rx="2"/>
<text x="485" y="111" font-size="10" font-weight="bold" fill="white" text-anchor="middle">URLs</text>
<text x="485" y="125" font-size="9" fill="#d6eaf8" text-anchor="middle">http/https/ftp</text>
<rect x="561" y="87" width="143" height="56" fill="#2980b9" rx="2"/>
<text x="632" y="111" font-size="10" font-weight="bold" fill="white" text-anchor="middle">File hashes</text>
<text x="632" y="125" font-size="9" fill="#d6eaf8" text-anchor="middle">MD5 SHA1 SHA256</text>
<rect x="708" y="87" width="143" height="56" fill="#85c1e9" rx="2"/>
<text x="779" y="111" font-size="10" font-weight="bold" fill="white" text-anchor="middle">Email addresses</text>
<text x="779" y="125" font-size="9" fill="#d6eaf8" text-anchor="middle">user@domain</text>
<text x="108" y="190" font-size="11" font-weight="bold" fill="#222" text-anchor="end">Deduplication</text>
<line x1="115" y1="150" x2="855" y2="150" stroke="#ccc" stroke-width="1"/>
<rect x="120" y="157" width="437" height="56" fill="#1a5276" rx="2"/>
<text x="338" y="181" font-size="10" font-weight="bold" fill="white" text-anchor="middle">Remove duplicates</text>
<text x="338" y="195" font-size="9" fill="#d6eaf8" text-anchor="middle">unique IOCs only</text>
<rect x="561" y="157" width="290" height="56" fill="#2980b9" rx="2"/>
<text x="706" y="181" font-size="10" font-weight="bold" fill="white" text-anchor="middle">Defang option</text>
<text x="706" y="195" font-size="9" fill="#d6eaf8" text-anchor="middle">replace . with [.]</text>
<text x="108" y="260" font-size="11" font-weight="bold" fill="#222" text-anchor="end">Output</text>
<line x1="115" y1="220" x2="855" y2="220" stroke="#ccc" stroke-width="1"/>
<rect x="120" y="227" width="437" height="56" fill="#1a5276" rx="2"/>
<text x="338" y="251" font-size="10" font-weight="bold" fill="white" text-anchor="middle">IOC list by type</text>
<text x="338" y="265" font-size="9" fill="#d6eaf8" text-anchor="middle">categorized</text>
<rect x="561" y="227" width="290" height="56" fill="#2980b9" rx="2"/>
<text x="706" y="251" font-size="10" font-weight="bold" fill="white" text-anchor="middle">CSV / JSON export</text>
<text x="706" y="265" font-size="9" fill="#d6eaf8" text-anchor="middle">--format option</text>
<line x1="115" y1="290" x2="855" y2="290" stroke="#ccc" stroke-width="1"/>
</svg>