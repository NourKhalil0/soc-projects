<rect x="414" y="227" width="290" height="56" fill="#1a5276" rx="2"/>
<text x="559" y="251" font-size="10" font-weight="bold" fill="white" text-anchor="middle">Port summary</text>
<text x="559" y="265" font-size="9" fill="#d6eaf8" text-anchor="middle">targeted services</text>
<rect x="708" y="227" width="143" height="56" fill="#d98880" rx="2"/>
