<svg width="900" height="300" viewBox="0 0 900 300" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
<rect width="900" height="300" fill="#f4f6f8"/>
<text x="108" y="50" font-size="11" font-weight="bold" fill="#222" text-anchor="end">Input</text>
<line x1="115" y1="10" x2="855" y2="10" stroke="#ccc" stroke-width="1"/>
<rect x="120" y="17" width="731" height="56" fill="#1a5276" rx="2"/>
<text x="485" y="41" font-size="10" font-weight="bold" fill="white" text-anchor="middle">Domain name</text>
<text x="485" y="55" font-size="9" fill="#d6eaf8" text-anchor="middle">user input</text>
<text x="108" y="111" font-size="11" font-weight="bold" fill="#222" text-anchor="end">DNS</text>
<text x="108" y="125" font-size="11" font-weight="bold" fill="#222" text-anchor="end">queries</text>
<line x1="115" y1="80" x2="855" y2="80" stroke="#ccc" stroke-width="1"/>
<rect x="120" y="87" width="143" height="56" fill="#1a5276" rx="2"/>
<text x="191" y="111" font-size="10" font-weight="bold" fill="white" text-anchor="middle">A record</text>
<text x="191" y="125" font-size="9" fill="#d6eaf8" text-anchor="middle">IPv4</text>
<rect x="267" y="87" width="143" height="56" fill="#1a5276" rx="2"/>
<text x="338" y="111" font-size="10" font-weight="bold" fill="white" text-anchor="middle">AAAA record</text>
<text x="338" y="125" font-size="9" fill="#d6eaf8" text-anchor="middle">IPv6</text>
<rect x="414" y="87" width="143" height="56" fill="#2980b9" rx="2"/>
<text x="485" y="111" font-size="10" font-weight="bold" fill="white" text-anchor="middle">MX record</text>
<text x="485" y="125" font-size="9" fill="#d6eaf8" text-anchor="middle">mail</text>
<rect x="561" y="87" width="143" height="56" fill="#2980b9" rx="2"/>
<text x="632" y="111" font-size="10" font-weight="bold" fill="white" text-anchor="middle">TXT record</text>
<text x="632" y="125" font-size="9" fill="#d6eaf8" text-anchor="middle">SPF info</text>
<rect x="708" y="87" width="143" height="56" fill="#85c1e9" rx="2"/>
<text x="779" y="111" font-size="10" font-weight="bold" fill="white" text-anchor="middle">NS record</text>
<text x="779" y="125" font-size="9" fill="#d6eaf8" text-anchor="middle">nameservers</text>
<text x="108" y="181" font-size="11" font-weight="bold" fill="#222" text-anchor="end">Reverse</text>
<text x="108" y="195" font-size="11" font-weight="bold" fill="#222" text-anchor="end">DNS</text>
<line x1="115" y1="150" x2="855" y2="150" stroke="#ccc" stroke-width="1"/>
<rect x="120" y="157" width="437" height="56" fill="#1a5276" rx="2"/>
<text x="338" y="181" font-size="10" font-weight="bold" fill="white" text-anchor="middle">PTR lookup</text>
<text x="338" y="195" font-size="9" fill="#d6eaf8" text-anchor="middle">IP to hostname</text>
<rect x="561" y="157" width="290" height="56" fill="#2980b9" rx="2"/>
<text x="706" y="181" font-size="10" font-weight="bold" fill="white" text-anchor="middle">Org lookup</text>
<text x="706" y="195" font-size="9" fill="#d6eaf8" text-anchor="middle">ASN / provider</text>
<text x="108" y="260" font-size="11" font-weight="bold" fill="#222" text-anchor="end">Output</text>
<line x1="115" y1="220" x2="855" y2="220" stroke="#ccc" stroke-width="1"/>
<rect x="120" y="227" width="437" height="56" fill="#1a5276" rx="2"/>
<text x="338" y="251" font-size="10" font-weight="bold" fill="white" text-anchor="middle">All DNS records</text>
<text x="338" y="265" font-size="9" fill="#d6eaf8" text-anchor="middle">formatted</text>
<rect x="561" y="227" width="290" height="56" fill="#2980b9" rx="2"/>
<text x="706" y="251" font-size="10" font-weight="bold" fill="white" text-anchor="middle">Reverse DNS result</text>
<text x="706" y="265" font-size="9" fill="#d6eaf8" text-anchor="middle">PTR record</text>
<line x1="115" y1="290" x2="855" y2="290" stroke="#ccc" stroke-width="1"/>
</svg>