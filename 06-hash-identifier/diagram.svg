<svg width="900" height="300" viewBox="0 0 900 300" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
<rect width="900" height="300" fill="#f4f6f8"/>
<text x="108" y="50" font-size="11" font-weight="bold" fill="#222" text-anchor="end">Input</text>
<line x1="115" y1="10" x2="855" y2="10" stroke="#ccc" stroke-width="1"/>
<rect x="120" y="17" width="437" height="56" fill="#1a5276" rx="2"/>
<text x="338" y="41" font-size="10" font-weight="bold" fill="white" text-anchor="middle">Hash string</text>
<text x="338" y="55" font-size="9" fill="#d6eaf8" text-anchor="middle">user input</text>
<rect x="561" y="17" width="290" height="56" fill="#2980b9" rx="2"/>
<text x="706" y="41" font-size="10" font-weight="bold" fill="white" text-anchor="middle">Hash file</text>
<text x="706" y="55" font-size="9" fill="#d6eaf8" text-anchor="middle">--file option</text>
<text x="108" y="120" font-size="11" font-weight="bold" fill="#222" text-anchor="end">Identification</text>
<line x1="115" y1="80" x2="855" y2="80" stroke="#ccc" stroke-width="1"/>
<rect x="120" y="87" width="290" height="56" fill="#1a5276" rx="2"/>
<text x="265" y="111" font-size="10" font-weight="bold" fill="white" text-anchor="middle">Length check</text>
<text x="265" y="125" font-size="9" fill="#d6eaf8" text-anchor="middle">32/40/64/128 chars</text>
<rect x="414" y="87" width="290" height="56" fill="#2980b9" rx="2"/>
<text x="559" y="111" font-size="10" font-weight="bold" fill="white" text-anchor="middle">Charset check</text>
<text x="559" y="125" font-size="9" fill="#d6eaf8" text-anchor="middle">hex / base64</text>
<rect x="708" y="87" width="143" height="56" fill="#85c1e9" rx="2"/>
<text x="779" y="111" font-size="10" font-weight="bold" fill="white" text-anchor="middle">Format match</text>
<text x="779" y="125" font-size="9" fill="#d6eaf8" text-anchor="middle">MD5 SHA1 SHA256 bcrypt</text>
<text x="108" y="181" font-size="11" font-weight="bold" fill="#222" text-anchor="end">Weak</text>
<text x="108" y="195" font-size="11" font-weight="bold" fill="#222" text-anchor="end">hash check</text>
<line x1="115" y1="150" x2="855" y2="150" stroke="#ccc" stroke-width="1"/>
<rect x="120" y="157" width="437" height="56" fill="#c0392b" rx="2"/>
<text x="338" y="181" font-size="10" font-weight="bold" fill="white" text-anchor="middle">Known weak hash DB</text>
<text x="338" y="195" font-size="9" fill="#d6eaf8" text-anchor="middle">common password hashes</text>
<rect x="561" y="157" width="290" height="56" fill="#d98880" rx="2"/>
<text x="706" y="181" font-size="10" font-weight="bold" fill="white" text-anchor="middle">Match result</text>
<text x="706" y="195" font-size="9" fill="#d6eaf8" text-anchor="middle">found / not found</text>
<text x="108" y="260" font-size="11" font-weight="bold" fill="#222" text-anchor="end">Output</text>
<line x1="115" y1="220" x2="855" y2="220" stroke="#ccc" stroke-width="1"/>
<rect x="120" y="227" width="290" height="56" fill="#1a5276" rx="2"/>
<text x="265" y="251" font-size="10" font-weight="bold" fill="white" text-anchor="middle">Hash type</text>
<text x="265" y="265" font-size="9" fill="#d6eaf8" text-anchor="middle">identified algorithm</text>
<rect x="414" y="227" width="290" height="56" fill="#2980b9" rx="2"/>
<text x="559" y="251" font-size="10" font-weight="bold" fill="white" text-anchor="middle">Crackability rating</text>
<text x="559" y="265" font-size="9" fill="#d6eaf8" text-anchor="middle">weak / strong</text>
<rect x="708" y="227" width="143" height="56" fill="#85c1e9" rx="2"/>
<text x="779" y="251" font-size="10" font-weight="bold" fill="white" text-anchor="middle">Recommendations</text>
<text x="779" y="265" font-size="9" fill="#d6eaf8" text-anchor="middle">upgrade if weak</text>
<line x1="115" y1="290" x2="855" y2="290" stroke="#ccc" stroke-width="1"/>
</svg>