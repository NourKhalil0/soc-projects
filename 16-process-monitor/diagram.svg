<svg width="900" height="300" viewBox="0 0 900 300" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
<rect width="900" height="300" fill="#f4f6f8"/>
<text x="108" y="50" font-size="11" font-weight="bold" fill="#222" text-anchor="end">Input</text>
<line x1="115" y1="10" x2="855" y2="10" stroke="#ccc" stroke-width="1"/>
<rect x="120" y="17" width="437" height="56" fill="#1a5276" rx="2"/>
<text x="338" y="41" font-size="10" font-weight="bold" fill="white" text-anchor="middle">Running processes</text>
<text x="338" y="55" font-size="9" fill="#d6eaf8" text-anchor="middle">psutil snapshot</text>
<rect x="561" y="17" width="290" height="56" fill="#c0392b" rx="2"/>
<text x="706" y="41" font-size="10" font-weight="bold" fill="white" text-anchor="middle">Malicious tool list</text>
<text x="706" y="55" font-size="9" fill="#d6eaf8" text-anchor="middle">blocklist.txt</text>
<text x="108" y="120" font-size="11" font-weight="bold" fill="#222" text-anchor="end">Collection</text>
<line x1="115" y1="80" x2="855" y2="80" stroke="#ccc" stroke-width="1"/>
<rect x="120" y="87" width="143" height="56" fill="#1a5276" rx="2"/>
<text x="191" y="111" font-size="10" font-weight="bold" fill="white" text-anchor="middle">Process name</text>
<text x="191" y="125" font-size="9" fill="#d6eaf8" text-anchor="middle">from OS</text>
<rect x="267" y="87" width="143" height="56" fill="#2980b9" rx="2"/>
<text x="338" y="111" font-size="10" font-weight="bold" fill="white" text-anchor="middle">PID</text>
<text x="338" y="125" font-size="9" fill="#d6eaf8" text-anchor="middle">process ID</text>
<rect x="414" y="87" width="143" height="56" fill="#2980b9" rx="2"/>
<text x="485" y="111" font-size="10" font-weight="bold" fill="white" text-anchor="middle">User</text>
<text x="485" y="125" font-size="9" fill="#d6eaf8" text-anchor="middle">running as</text>
<rect x="561" y="87" width="290" height="56" fill="#85c1e9" rx="2"/>
<text x="706" y="111" font-size="10" font-weight="bold" fill="white" text-anchor="middle">Command line</text>
<text x="706" y="125" font-size="9" fill="#d6eaf8" text-anchor="middle">full args</text>
<text x="108" y="190" font-size="11" font-weight="bold" fill="#222" text-anchor="end">Matching</text>
<line x1="115" y1="150" x2="855" y2="150" stroke="#ccc" stroke-width="1"/>
<rect x="120" y="157" width="437" height="56" fill="#c0392b" rx="2"/>
<text x="338" y="181" font-size="10" font-weight="bold" fill="white" text-anchor="middle">Name match</text>
<text x="338" y="195" font-size="9" fill="#d6eaf8" text-anchor="middle">exact and partial</text>
<rect x="561" y="157" width="290" height="56" fill="#d98880" rx="2"/>
<text x="706" y="181" font-size="10" font-weight="bold" fill="white" text-anchor="middle">Path match</text>
<text x="706" y="195" font-size="9" fill="#d6eaf8" text-anchor="middle">suspicious directories</text>
<text x="108" y="260" font-size="11" font-weight="bold" fill="#222" text-anchor="end">Output</text>
<line x1="115" y1="220" x2="855" y2="220" stroke="#ccc" stroke-width="1"/>
<rect x="120" y="227" width="437" height="56" fill="#c0392b" rx="2"/>
<text x="338" y="251" font-size="10" font-weight="bold" fill="white" text-anchor="middle">Flagged processes</text>
<text x="338" y="265" font-size="9" fill="#d6eaf8" text-anchor="middle">name PID user</text>
<rect x="561" y="227" width="290" height="56" fill="#1a5276" rx="2"/>
<text x="706" y="251" font-size="10" font-weight="bold" fill="white" text-anchor="middle">Clean process count</text>
<text x="706" y="265" font-size="9" fill="#d6eaf8" text-anchor="middle">total scanned</text>
<line x1="115" y1="290" x2="855" y2="290" stroke="#ccc" stroke-width="1"/>
</svg>